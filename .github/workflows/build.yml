name: build

on:
  push:
  pull_request:

env:
  THEOS: /opt/theos
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: advice.defaultBranchName
  GIT_CONFIG_VALUE_0: "false"

jobs:
  static:
    name: static-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck release and dependency scripts
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends shellcheck
          # SC1091 (sourcing $THEOS/bin/lane.sh, which lives outside the
          # repo) is expected: the path is validated at build time by
          # build.sh's `: "${THEOS:?...}"` guard plus lane.sh's own CLI.
          shellcheck -e SC1091 build.sh tools/release/*.sh tools/dependencies/*.sh
          bash -n build.sh
          for f in tools/release/*.sh tools/dependencies/*.sh tools/conformance/*.sh; do bash -n "$f"; done

      # The Mach-O conformance harness parses REAL cross-built Apple-target
      # binaries instead of synthetic fixtures (see tools/conformance/
      # macho_conformance.c): the fixtures are two tiny dylibs built with
      # the Theos cross clang already required below, so no device and no
      # committed third-party binaries are needed. The assertions pin the
      # load-bearing properties: well-formed images parse (status=0), the
      # local symbol resolves identically in file and loaded layouts, and
      # the importing dylib exposes import slots.
      - name: Resolver conformance over real Mach-O fixtures
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential curl perl xz-utils git libxml2
          sudo git clone --recursive --quiet https://github.com/jjolano/theos.git "$THEOS"
          # Fixture dylibs need the cross clang (toolchain/linux) and the
          # pinned SDK row; provision.lock is the pinned source for both.
          sudo -E "$THEOS/bin/provision.sh" --downloads \
            toolchain/linux sdks/iPhoneOS16.5.sdk
          sudo chown -R "$(id -u):$(id -g)" "$THEOS/toolchain" "$THEOS/sdks"
          bash tools/conformance/macho_conformance_fixtures.sh "$RUNNER_TEMP/hkfix"
          clang -Wall -Wextra -Werror -std=c11 -O1 \
            -o "$RUNNER_TEMP/macho_conformance" \
            tools/conformance/macho_conformance.c src/resolvers/*.c
          "$RUNNER_TEMP/macho_conformance" "$RUNNER_TEMP/hkfix/hkhello.dylib" hk_hello_add \
            | tee "$RUNNER_TEMP/conformance1.txt"
          "$RUNNER_TEMP/macho_conformance" "$RUNNER_TEMP/hkfix/hkhello2.dylib" hk_hello_add \
            | tee "$RUNNER_TEMP/conformance2.txt"
          grep -q 'header:.*status=0' "$RUNNER_TEMP/conformance1.txt"
          grep -q 'resolve hk_hello_add.*status=0' "$RUNNER_TEMP/conformance1.txt"
          grep -q 'slots:.*status=0 n=2' "$RUNNER_TEMP/conformance2.txt"
          file_raw=$(grep -m1 '\[loaded\] resolve hk_hello_add' "$RUNNER_TEMP/conformance1.txt" | grep -o 'raw=0x[0-9a-f]*')
          loaded_raw=$(grep -m1 '^     resolve hk_hello_add' "$RUNNER_TEMP/conformance1.txt" | grep -o 'raw=0x[0-9a-f]*')
          test -n "$file_raw" && test "$file_raw" = "$loaded_raw"
          if grep -E 'status=[1-9][0-9]*' "$RUNNER_TEMP/conformance1.txt" | grep -v 'chained fixups:'; then
            echo "error: resolver reported failure on a well-formed image" >&2
            exit 1
          fi

  sanitize:
    name: host-tests-asan-ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # ASan+UBSan over the host suite via the Makefile's HOOKKIT_SANITIZE
      # hook. One exclusion: the ObjC header-compile modes need cc1obj
      # (absent on bare Ubuntu; Apple toolchains have it, and the lane jobs
      # cover those modes). The --wrap interceptor used by the
      # fault-injection sweep coexists with the sanitizer runtimes, so the
      # sweep runs in the same lane.
      - name: Install clang runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang libclang-rt-18-dev build-essential python3

      - name: Run host tests under ASan+UBSan
        env:
          HOOKKIT_SANITIZE: address,undefined
          HOOKKIT_SKIP_OBJC: "1"
        run: |
          set -euo pipefail
          make test-header-compile \
            test-shadow-manifest test-provider-evidence \
            test-runtime-lifecycle test-plan-lifecycle test-hook-add \
            test-plan-analyze test-engine-registry test-backend-policy \
            test-backend-enumeration test-plan-prepare test-plan-commit \
            test-ownership test-domain-gate test-artifact-ledger \
            test-installed-original test-plan-model test-fault-injection \
            test-image-catalog test-symbol-table test-macho test-export-trie \
            test-symbol-resolve test-import-slots test-chained-fixups \
            test-pointer-auth test-cache-patches test-rebind-engine \
            test-rebind-pac test-rebind-wired test-memory-engine \
            test-memory-wired test-objc-engine test-objc-wired \
            test-inline-engine test-inline-wired test-image-scope \
            test-reloc-inline-engine test-reloc-inline-wired \
            test-static-continuation test-provider-vtable \
            test-reloc test-swift-abi test-swift-engine

  pac:
    name: macos-pac
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # This exercises real Apple-silicon PAC instructions, not HookKit's
      # tagged host simulator. It does not claim macOS backend or iOS
      # shared-cache support.
      - name: Run native PAC self-test
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcrun clang \
            -Wall -Wextra -Werror -std=c11 -O2 \
            -arch arm64e \
            -DHK_EXPECT_NATIVE_PTRAUTH=1 \
            -o "$RUNNER_TEMP/test_pointer_auth" \
            tests/host/test_pointer_auth.c src/core/HKOwnership.c \
            -lpthread
          "$RUNNER_TEMP/test_pointer_auth"

  macos-hooks:
    name: macos-hooks-${{ matrix.arch }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm64e]
    steps:
      - uses: actions/checkout@v7

      - name: Run live hook smoke
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          target_link_flags=
          if [[ "${{ matrix.arch }}" == arm64 ]]; then
            target_link_flags=-Wl,-no_fixup_chains
          fi
          out="$RUNNER_TEMP/hookkit-live-${{ matrix.arch }}"
          targets="$RUNNER_TEMP/libHookKitLiveTargets.dylib"
          xcrun clang -Wall -Wextra -Werror -O0 -fno-inline \
            -arch "${{ matrix.arch }}" -dynamiclib \
            -install_name @rpath/libHookKitLiveTargets.dylib \
            -o "$targets" tests/macos/live_hook_targets.c
          # arm64e note: the relocating-inline live test is arm64-only. Its
          # trampoline page comes from vm_allocate + vm_protect(R-X), which
          # macOS refuses to execute on arm64e (MAP_JIT-less W^X); the same
          # path passes on arm64 macOS and on iOS, where the transition is
          # honored. It lives in its own binary so the arm64e job compiles
          # the full closure but only runs the portable suite.
          xcrun clang -Wall -Wextra -Werror -O0 -fno-inline -fblocks \
            -arch "${{ matrix.arch }}" ${target_link_flags} \
            -framework Foundation -lpthread \
            -o "$out" \
            tests/macos/test_live_hooks.m \
            src/engines/HKInlineEngine.c \
            src/engines/HKInlineVtable.c \
            src/engines/HKMemoryEngine.c \
            src/engines/HKMemoryVtable.c \
            src/engines/HKObjCEngine.c \
            src/engines/HKObjCVtable.c \
            src/engines/HKRebindEngine.c \
            src/engines/HKRebindVtable.c \
            src/engines/HKRelocInlineEngine.c \
            src/engines/HKRelocInlineVtable.c \
            src/engines/HKStaticPool.c \
            src/resolvers/HKChainedFixups.c \
            src/resolvers/HKDyldCachePatches.c \
            src/resolvers/HKExportTrie.c \
            src/resolvers/HKImportSlots.c \
            src/resolvers/HKMachO.c \
            src/resolvers/HKSymbolResolve.c \
            src/resolvers/HKSymbolTable.c \
            src/core/HKArtifactLedger.c src/core/HKIDs.c \
            src/core/HKImageCatalog.c src/core/HKImageScope.c \
            src/native/hk_arm64.c src/native/hk_native.c src/native/hk_symbols.c
          "$out" "$targets"
          if [[ "${{ matrix.arch }}" != arm64e ]]; then
            reloc_out="$RUNNER_TEMP/hookkit-live-reloc-${{ matrix.arch }}"
            xcrun clang -Wall -Wextra -Werror -O0 -fno-inline -fblocks \
              -arch "${{ matrix.arch }}" ${target_link_flags} \
              -framework Foundation -lpthread \
              -o "$reloc_out" \
              tests/macos/test_live_reloc_inline.m \
              src/engines/HKRelocInlineEngine.c \
              src/resolvers/HKMachO.c src/resolvers/HKSymbolTable.c \
              src/core/HKArtifactLedger.c src/core/HKIDs.c \
              src/core/HKImageCatalog.c src/core/HKImageScope.c \
              src/native/hk_arm64.c src/native/hk_native.c src/native/hk_symbols.c
            "$reloc_out" "$targets"
          fi

  legacy:
    name: rootful-legacy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Theos and old-ABI toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl xz-utils git libxml2 libtinfo6
          # jjolano/theos is upstream Theos plus RootHide support, and carries
          # provision.lock -- the single pinned source for the old-ABI toolchain
          # and SDKs that this job used to fetch inline. This lane is rootful, so
          # the RootHide additions are inert here.
          sudo git clone --recursive --quiet https://github.com/jjolano/theos.git "$THEOS"
          sudo -E "$THEOS/bin/provision.sh" --downloads \
            toolchain/oldabi/linux sdks/iPhoneOS13.7.sdk

      - name: Build and verify
        run: ./build.sh rootful-legacy

      # The legacy lane build covers host tests + packaging; compile the
      # device smokes too, with the old-ABI toolchain and the 13.7 SDK,
      # overriding only the compiler/SDK selectors (the single-quoted
      # '${SDKBINPATH}' defers to lane.sh's abi args expanded by make).
      - name: Compile device smokes (no device needed)
        run: |
          set -euo pipefail
          . "$THEOS/bin/lane.sh"
          mapfile -t args < <(theos_lane_args rootful-legacy)
          make "${args[@]}" device-compile-check \
            'DEVICE_CANONICAL_CLANG=${SDKBINPATH}/clang' \
            "DEVICE_CANONICAL_SDK=$THEOS/sdks/iPhoneOS13.7.sdk" \
            DEVICE_CANONICAL_MIN=9.0 DEVICE_CANONICAL_ARCH=arm64 \
            DEVICE_CANONICAL_LDID=true 'DEVICE_SMOKE_CLANG=${SDKBINPATH}/clang' \
            "DEVICE_SMOKE_SDK=$THEOS/sdks/iPhoneOS13.7.sdk" \
            DEVICE_SMOKE_MIN=9.0 DEVICE_SMOKE_ARCH=arm64 DEVICE_SMOKE_LDID=true

      # Dobby's provider engine is compiled out of the legacy lane
      # (HK_NO_DOBBY, see Makefile) -- the check runs here only because this
      # is the one Ubuntu lane, and the script itself needs GNU/shadow
      # tooling (lipo/vtool/ar/nm) absent on macOS runners. The modern lanes
      # that actually link -ldobby inherit the pinned archive verified here.
      - name: Verify Dobby provenance
        run: bash tools/dependencies/rebuild-dobby.sh --check

      # Shadow 3.7.6 vendors a historical HookKit commit. Its pin predates
      # the tag lineage, so the gate asserts the retained facade markers --
      # the actual contract -- rather than commit ancestry.
      - name: Verify Shadow 3.7.6 facade contract
        run: |
          set -euo pipefail
          git clone --quiet --branch v3.7.6 --depth 1 \
            https://github.com/jjolano/shadow.git "$RUNNER_TEMP/shadow"
          git fetch --quiet origin a40f5157394d7f099af1a01a01b5ddd95e6d2ba3 \
            || true
          bash tools/release/check_shadow376_compat.sh "$RUNNER_TEMP/shadow"

      - uses: actions/upload-artifact@v7
        with:
          name: hookkit-rootful-legacy
          path: .theos/release/hookkit-rootful-legacy.deb

  modern:
    name: ${{ matrix.flavor }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        flavor: [rootful-modern, rootless, roothide]
    steps:
      - uses: actions/checkout@v7

      - name: Restore Frida Gum devkit
        uses: actions/cache@v6
        with:
          path: |
            vendor/gum/frida-gum.h
            vendor/gum/libfrida-gum.a
            vendor/gum/.devkit-*
          # fetch-gum.sh records hashes of the extracted artifacts in
          # .devkit-*.artifacts and re-verifies them on a cache hit, so a
          # poisoned cache fails the build instead of linking silently. The
          # lock hash keys the cache; the script's own hash detects a
          # verification-logic change that must invalidate stored artifacts.
          key: frida-gum-${{ runner.os }}-${{ hashFiles('vendor/gum/gum.lock', 'tools/dependencies/fetch-gum.sh') }}

      - name: Install Theos
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install make dpkg ldid
          sudo git clone --recursive --quiet https://github.com/roothide/theos.git "$THEOS"

      # The lane TARGETs pin iPhoneOS16.5.sdk (see Makefile) so builds are
      # reproducible across toolchains; Xcode's bundled SDK may be newer, so
      # stage the pinned one explicitly.
      - name: Stage pinned iPhoneOS16.5 SDK
        run: |
          set -euo pipefail
          curl -fL -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          echo '5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb  '"$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" | sha256sum -c -
          sudo mkdir -p "$THEOS/sdks"
          sudo tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"

      - name: Build and verify
        env:
          MAKE_COMMAND: gmake
        run: ./build.sh "${{ matrix.flavor }}"

      # Every device smoke target the Makefile defines is built with its own
      # recipe (minus the device-only sign step, which ldid handles --
      # building IS the gate; execution needs a jailbroken device). Driving
      # it from the Makefile keeps the gate honest: a new smoke target is
      # covered automatically, with its own flags (-lobjc, fixture
      # includes) from the single recipe. Modern lanes run on macOS
      # (Xcode clang); the legacy lane runs on Ubuntu (old-ABI toolchain).
      - name: Compile device smokes (no device needed)
        env:
          MAKE_COMMAND: gmake
        run: |
          set -euo pipefail
          if [[ "${{ matrix.flavor }}" == rootful-legacy ]]; then
            ./build.sh rootful-legacy >/dev/null
          else
            gmake device-compile-check
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: hookkit-${{ matrix.flavor }}
          path: |
            .theos/release/hookkit-${{ matrix.flavor }}.deb
            .theos/release/hookkit-${{ matrix.flavor }}-gum.deb
