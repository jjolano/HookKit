name: build

on:
  push:
  pull_request:

env:
  THEOS: /opt/theos

jobs:
  pac:
    name: macos-pac
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # This exercises real Apple-silicon PAC instructions, not HookKit's
      # tagged host simulator. It does not claim macOS backend or iOS
      # shared-cache support.
      - name: Run native PAC self-test
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcrun clang \
            -Wall -Wextra -Werror -std=c11 -O2 \
            -arch arm64e \
            -DHK_EXPECT_NATIVE_PTRAUTH=1 \
            -o "$RUNNER_TEMP/test_pointer_auth" \
            Tests/Host/test_pointer_auth.c Sources/Core/HKOwnership.c \
            -lpthread
          "$RUNNER_TEMP/test_pointer_auth"

  macos-hooks:
    name: macos-hooks-${{ matrix.arch }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm64e]
    steps:
      - uses: actions/checkout@v4

      - name: Run live hook smoke
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          out="$RUNNER_TEMP/hookkit-live-${{ matrix.arch }}"
          targets="$RUNNER_TEMP/libHookKitLiveTargets.dylib"
          xcrun clang -Wall -Wextra -Werror -O0 -fno-inline \
            -arch "${{ matrix.arch }}" -dynamiclib \
            -install_name @rpath/libHookKitLiveTargets.dylib \
            -o "$targets" Tests/MacOS/live_hook_targets.c
          xcrun clang -Wall -Wextra -Werror -O0 -fno-inline -fblocks \
            -DHK_REBIND_DIAGNOSTICS \
            -arch "${{ matrix.arch }}" -Wl,-no_fixup_chains \
            -framework Foundation -lpthread \
            -o "$out" \
            Tests/MacOS/test_live_hooks.m \
            Sources/Engines/HKInlineEngine.c \
            Sources/Engines/HKMemoryEngine.c \
            Sources/Engines/HKObjCEngine.c \
            Sources/Engines/HKRebindEngine.c \
            Sources/Resolvers/HKChainedFixups.c \
            Sources/Resolvers/HKDyldCachePatches.c \
            Sources/Resolvers/HKExportTrie.c \
            Sources/Resolvers/HKImportSlots.c \
            Sources/Resolvers/HKMachO.c \
            Sources/Resolvers/HKSymbolResolve.c \
            Sources/Resolvers/HKSymbolTable.c \
            Sources/Core/HKArtifactLedger.c Sources/Core/HKIDs.c \
            native/hk_arm64.c native/hk_native.c native/hk_symbols.c
          "$out" "$targets"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hookkit-live-${{ matrix.arch }}
          path: ${{ runner.temp }}/hookkit-live-${{ matrix.arch }}

  legacy:
    name: rootful-legacy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos and old-ABI toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl xz-utils git libxml2 libtinfo6
          sudo git clone --recursive --quiet https://github.com/theos/theos.git "$THEOS"

          mkdir -p "$RUNNER_TEMP/oldabi"
          curl -fL -o "$RUNNER_TEMP/oldabi/toolchain.tar.xz" \
            https://github.com/L1ghtmann/llvm-project/releases/download/test-210562a/iOSToolchain-x86_64.tar.xz
          echo 'a72a7a577e2fbe2838b6b5e9c72034fa7d114af96f0e1d4b016f18730ce4056e  '"$RUNNER_TEMP/oldabi/toolchain.tar.xz" | sha256sum -c -
          sudo mkdir -p "$THEOS/toolchain/oldabi"
          sudo tar -xJf "$RUNNER_TEMP/oldabi/toolchain.tar.xz" -C "$THEOS/toolchain/oldabi"

          curl -fL -o "$RUNNER_TEMP/oldabi/iPhoneOS13.7.sdk.tar.xz" \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS13.7.sdk.tar.xz
          echo '661d1a8c518025f084d8c1e70dd8767581fb5730fb5950378f0915d840a7b5c3  '"$RUNNER_TEMP/oldabi/iPhoneOS13.7.sdk.tar.xz" | sha256sum -c -
          sudo tar -xJf "$RUNNER_TEMP/oldabi/iPhoneOS13.7.sdk.tar.xz" -C "$THEOS/sdks"

      - name: Build and verify
        run: ./build.sh rootful-legacy

      - uses: actions/upload-artifact@v4
        with:
          name: hookkit-rootful-legacy
          path: build/hookkit-rootful-legacy.deb

  modern:
    name: ${{ matrix.flavor }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        flavor: [rootful-modern, rootless, roothide]
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install dpkg ldid
          sudo git clone --recursive --quiet https://github.com/roothide/theos.git "$THEOS"

      - name: Build and verify
        run: ./build.sh "${{ matrix.flavor }}"

      - uses: actions/upload-artifact@v4
        with:
          name: hookkit-${{ matrix.flavor }}
          path: build/hookkit-${{ matrix.flavor }}.deb
